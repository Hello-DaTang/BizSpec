name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run pack:check
      - name: Smoke test Git-style CLI package
        run: |
          node bin/bizspec.mjs init /tmp/bizspec-smoke --yes --tools codex,claude --id smoke --title "Smoke Test"
          node bin/bizspec.mjs validate /tmp/bizspec-smoke
          node bin/bizspec.mjs status /tmp/bizspec-smoke
          node bin/bizspec.mjs next /tmp/bizspec-smoke

  python-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest -q
