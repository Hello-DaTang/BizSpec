name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install development dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Type-check and test
        run: npm test
      - name: Build CLI
        run: npm run build
      - name: Verify package contents
        run: npm run pack:check
      - name: Smoke test compiled CLI
        run: |
          node dist/bin.js init /tmp/bizspec-smoke --yes --tools codex,claude --id smoke --title "Smoke Test"
          node dist/bin.js validate /tmp/bizspec-smoke
          node dist/bin.js status /tmp/bizspec-smoke
          node dist/bin.js next /tmp/bizspec-smoke
